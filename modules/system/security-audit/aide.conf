# AIDE monitors mutable system state only. /nix/store is content-addressed and
# read-only; its integrity is verified with `sudo nix store verify --all`.

gzip_dbout=yes
database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
database_new=file:/var/lib/aide/aide.db.new.gz

Full = p+n+u+g+s+l+sha256+sha512

# First matching rule wins, so volatile files are excluded before /etc
!/etc/mtab$
!/etc/resolv.conf$
!/etc/adjtime$
!/root/.cache

/etc Full
/boot Full
/root Full
