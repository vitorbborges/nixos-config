<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencode web</title>
<style>
  :root {
    --bg:      @bg@;
    --panel:   @panel@;
    --text:    @text@;
    --muted:   @muted@;
    --primary: @primary@;
    --success: @success@;
    --error:   @error@;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "@font@", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--muted);
    border-radius: 12px;
    padding: 2.5rem 3rem;
    width: 22rem;
    text-align: center;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.75rem;
  }
  #dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
  }
  #dot.on  { background: var(--success); box-shadow: 0 0 8px var(--success); }
  #dot.off { background: var(--error);   box-shadow: 0 0 8px var(--error); }
  .row {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-bottom: 0.75rem;
  }
  button {
    flex: 1;
    padding: 0.65rem 1rem;
    border: 1px solid var(--muted);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--primary); }
  button:disabled { opacity: 0.4; cursor: default; }
  #start { border-color: var(--success); color: var(--success); }
  #stop  { border-color: var(--error);   color: var(--error); }
  #open  { flex: 1; margin-bottom: 0.75rem; }
  #err {
    color: var(--error);
    font-size: 0.8rem;
    min-height: 1.1em;
    margin-bottom: 0.5rem;
    word-break: break-word;
  }
  .hint {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 1.25rem;
  }
  .hint code {
    font-family: monospace;
    color: var(--primary);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>opencode web</h1>
    <div class="status">
      <span id="dot" class="off"></span>
      <span id="status">stopped</span>
    </div>

    <div class="row">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <button id="open" style="display:none">Open Web UI</button>
    <div id="err"></div>

    <div class="hint">
      auto-starts on open &middot; auto-stops after you close this tab<br>
      sessions persist across restarts &middot; attach with<br>
      <code>opencode attach http://localhost:@webPort@</code>
    </div>
  </div>

<script>
  const dot    = document.getElementById("dot");
  const status = document.getElementById("status");
  const start  = document.getElementById("start");
  const stop   = document.getElementById("stop");
  const open   = document.getElementById("open");
  const err    = document.getElementById("err");

  async function refresh() {
    try {
      const r = await fetch("/status");
      const s = await r.json();
      dot.className     = s.active ? "on" : "off";
      status.textContent = s.active ? "running" : "stopped";
      start.disabled = s.active;
      stop.disabled  = !s.active;
      open.style.display = s.active ? "block" : "none";
    } catch { /* ctl server unreachable */ }
  }

  async function act(path) {
    err.textContent = "";
    start.disabled = stop.disabled = true;
    try {
      const r = await fetch(path, { method: "POST" });
      const s = await r.json();
      if (!s.ok) err.textContent = s.stderr || "failed";
    } catch {
      err.textContent = "control server unreachable";
    }
    setTimeout(refresh, 800);
  }

  start.onclick = () => act("/start");
  stop.onclick  = () => act("/stop");
  open.onclick  = () => window.open("http://localhost:@webPort@", "_blank");

  // heartbeat: keeps the server alive while this page is open
  async function heartbeat() {
    try { await fetch("/heartbeat", { method: "POST", body: "1" }); } catch {}
  }
  // closing tab: stop the server (server ignores if another tab still pings)
  window.addEventListener("beforeunload", () => {
    navigator.sendBeacon("/heartbeat", "stop");
  });

  act("/start"); // auto-start on entry
  refresh();
  setInterval(heartbeat, 5000);
  setInterval(refresh, 2000);
</script>
</body>
</html>
